name: Release

# Per-package releases via multi-semantic-release.
#
# - Triggered on push to `master` (stable) and `beta` (prerelease).
# - Conventional commits drive version bumps per package.
# - When a workspace package is published, every dependent gets a
#   patch release with the new dep version (deps.bump=override,
#   deps.release=patch).
# - npm publish uses Trusted Publishing (OIDC) — no NPM_TOKEN secret.
#
# One-time setup per package on npmjs.com:
#   Settings > Publishing access > Add Trusted Publisher
#     Publisher: GitHub Actions
#     Owner: privacybydesign
#     Repository: yivi-frontend-packages
#     Workflow filename: release.yml
#     Environment: (leave empty)
#
# Required repo secrets / vars: none. GITHUB_TOKEN is auto-provisioned.

on:
  push:
    branches:
      - master
      - beta

permissions:
  contents: write       # tag releases + create GitHub releases
  issues: write         # semantic-release comments on resolved issues
  pull-requests: write  # semantic-release comments on merged PRs
  id-token: write       # npm Trusted Publishing (OIDC)

concurrency:
  # Don't cancel an in-flight release; a second push to master should
  # queue and run after the first finishes, otherwise the second job
  # races the first on tag creation.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # semantic-release needs full history

      - uses: actions/setup-node@v6
        with:
          node-version: 24 # ships with npm 11 (Trusted Publishing-capable)
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `workspaces-update=false` stops `npm version` (run by
        # @semantic-release/npm during prepare) from refreshing the
        # lockfile. Without it, npm tries to resolve the
        # just-cascaded `@privacybydesign/yivi-core@1.0.0` (etc.)
        # against the registry — but those versions haven't been
        # published yet — and fails with ETARGET. Known
        # multi-semantic-release + npm-workspaces interaction:
        # https://github.com/dhoulb/multi-semantic-release/issues/112
        run: |
          npm config set workspaces-update false
          npm run release
