name: PR title

# Enforces Conventional Commit style PR titles so semantic-release can
# determine the appropriate version bump from the squash-merge commit
# message. See https://www.conventionalcommits.org/.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  pr-title:
    uses: privacybydesign/github-workflows/.github/workflows/pr-title.yml@v1
    permissions:
      pull-requests: read
